name: Deploy docs to GitHub Pages

# Publishes docs/ from BOTH long-lived branches into one Pages site:
#   main    -> https://metascalp.github.io/metascalp-sdk/
#   develop -> https://metascalp.github.io/metascalp-sdk/develop/
# Either branch's push rebuilds the whole site, so both halves are always current.

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          path: develop

      - name: Assemble site (main at /, develop at /develop/)
        run: |
          mkdir -p site/develop
          cp -r main/docs/. site/
          cp -r develop/docs/. site/develop/
          touch site/.nojekyll
          echo "== site tree =="; find site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
